name: Daily Mongo Backup to Drive

on:
  schedule:
    # 20:30 UTC = 02:00 AM Sri Lanka Standard Time
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  backup_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install MongoDB Tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-tools

      - name: Create Database Dump
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          # Create filename with date: backup-2026-02-01.gz
          FILENAME="backup-$(date +%F).gz"
          
          # Dump specific DB (safest) or full cluster
          # Added '--db test' to ensure we only grab that specific database
          mongodump --uri="$MONGO_URI" --db test --archive="$FILENAME" --gzip
          
          # Save filename to env for the next step
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: ${{ env.BACKUP_FILENAME }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "false" # Keep history of backups
          
      - name: Cleanup Runner
        if: always()
        run: rm -f *.gz